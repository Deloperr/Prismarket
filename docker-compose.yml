# Full stack: API + React (single container), PostgreSQL, Redis (cache), Mailpit (SMTP sandbox)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prismarket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["${POSTGRES_PORT:-5435}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prismarket"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # web UI with all e-mails sent by the app
      - "1025:1025"   # SMTP

  app:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      mailpit: { condition: service_started }
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=prismarket;Username=postgres;Password=postgres
      ConnectionStrings__Redis: redis:6379
      Smtp__Host: mailpit
      Smtp__Port: 1025
      App__FrontendUrl: http://localhost:8080
      Jwt__Secret: ${JWT_SECRET:-change_me_to_a_long_random_secret_value_!!}
      Cors__Origins__0: http://localhost:8080
    ports: ["8080:8080"]
    volumes: [appdata:/data]

volumes:
  pgdata:
  appdata:
